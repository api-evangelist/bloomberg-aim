    namespace: bloomberg-data-license-field-lists-rest
    port: 8080
    description: REST adapter for Bloomberg Data License API (HAPI) — Field Lists. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/catalogs/{catalogid}/fieldlists
      name: catalogs-catalogid-fieldlists
      description: REST surface for catalogs-catalogId-fieldLists.
      operations:
      - method: GET
        name: listfieldlists
        description: List Field Lists
        call: bloomberg-data-license-field-lists.listfieldlists
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createfieldlist
        description: Create a Field List
        call: bloomberg-data-license-field-lists.createfieldlist
        with:
