naftiko: 1.0.0-alpha2
info:
  label: Bloomberg Data License API (HAPI) — Field Lists
  description: 'Bloomberg Data License API (HAPI) — Field Lists. 4 operations. Lead operation: List Field Lists. Self-contained
    Naftiko capability covering one Bloomberg Aim business surface.'
  tags:
  - Bloomberg Aim
  - Field Lists
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
