    description: Bloomberg Data License API (HAPI) — Field Lists business capability. Self-contained, no shared references.
    resources:
    - name: catalogs-catalogId-fieldLists
      path: /catalogs/{catalogId}/fieldLists
      operations:
      - name: listfieldlists
        method: GET
        description: List Field Lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createfieldlist
        method: POST
        description: Create a Field List
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
