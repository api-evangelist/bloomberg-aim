naftiko: 1.0.0-alpha2
info:
  label: Bloomberg EMSX API — Teams
  description: 'Bloomberg EMSX API — Teams. 2 operations. Lead operation: Assign a Trader to an Order. Self-contained Naftiko
    capability covering one Bloomberg Aim business surface.'
  tags:
  - Bloomberg Aim
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BLOOMBERG_AIM_API_KEY: BLOOMBERG_AIM_API_KEY
capability:
  consumes:
  - type: http
    namespace: bloomberg-emsx-teams
    baseUri: https://localhost:3000
    description: Bloomberg EMSX API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: request-blp-emapisvc-AssignTrader
      path: /request/blp/emapisvc/AssignTrader
      operations:
      - name: assigntrader
        method: POST
        description: Assign a Trader to an Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: request-blp-emapisvc-GetTeams
      path: /request/blp/emapisvc/GetTeams
      operations:
      - name: getteams
        method: POST
        description: Get Emsx Teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.BLOOMBERG_AIM_API_KEY}}'
  exposes:
  - type: rest
    namespace: bloomberg-emsx-teams-rest
    port: 8080
    description: REST adapter for Bloomberg EMSX API — Teams. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/request/blp/emapisvc/assigntrader
      name: request-blp-emapisvc-assigntrader
      description: REST surface for request-blp-emapisvc-AssignTrader.
      operations:
      - method: POST
        name: assigntrader
        description: Assign a Trader to an Order
        call: bloomberg-emsx-teams.assigntrader
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/request/blp/emapisvc/getteams
      name: request-blp-emapisvc-getteams
      description: REST surface for request-blp-emapisvc-GetTeams.
      operations:
      - method: POST
        name: getteams
        description: Get Emsx Teams
        call: bloomberg-emsx-teams.getteams
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bloomberg-emsx-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bloomberg EMSX API — Teams. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: assign-trader-order
      description: Assign a Trader to an Order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bloomberg-emsx-teams.assigntrader
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-emsx-teams
      description: Get Emsx Teams
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: bloomberg-emsx-teams.getteams
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
