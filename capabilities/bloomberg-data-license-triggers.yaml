naftiko: 1.0.0-alpha2
info:
  label: Bloomberg Data License API (HAPI) — Triggers
  description: 'Bloomberg Data License API (HAPI) — Triggers. 3 operations. Lead operation: List Triggers. Self-contained
    Naftiko capability covering one Bloomberg Aim business surface.'
  tags:
  - Bloomberg Aim
  - Triggers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BLOOMBERG_AIM_API_KEY: BLOOMBERG_AIM_API_KEY
capability:
  consumes:
  - type: http
    namespace: bloomberg-data-license-triggers
    baseUri: https://api.bloomberg.com/eap
    description: Bloomberg Data License API (HAPI) — Triggers business capability. Self-contained, no shared references.
    resources:
    - name: catalogs-catalogId-triggers
      path: /catalogs/{catalogId}/triggers
      operations:
      - name: listtriggers
        method: GET
        description: List Triggers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtrigger
        method: POST
        description: Create a Trigger
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: catalogs-catalogId-triggers-triggerId
      path: /catalogs/{catalogId}/triggers/{triggerId}
      operations:
      - name: gettrigger
        method: GET
        description: Get Trigger Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.BLOOMBERG_AIM_API_KEY}}'
  exposes:
  - type: rest
    namespace: bloomberg-data-license-triggers-rest
    port: 8080
    description: REST adapter for Bloomberg Data License API (HAPI) — Triggers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/catalogs/{catalogid}/triggers
      name: catalogs-catalogid-triggers
      description: REST surface for catalogs-catalogId-triggers.
      operations:
      - method: GET
        name: listtriggers
        description: List Triggers
        call: bloomberg-data-license-triggers.listtriggers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtrigger
        description: Create a Trigger
        call: bloomberg-data-license-triggers.createtrigger
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalogs/{catalogid}/triggers/{triggerid}
      name: catalogs-catalogid-triggers-triggerid
      description: REST surface for catalogs-catalogId-triggers-triggerId.
      operations:
      - method: GET
        name: gettrigger
        description: Get Trigger Details
        call: bloomberg-data-license-triggers.gettrigger
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bloomberg-data-license-triggers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bloomberg Data License API (HAPI) — Triggers. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-triggers
      description: List Triggers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bloomberg-data-license-triggers.listtriggers
      outputParameters:
      - type: object
        mapping: $.
    - name: create-trigger
      description: Create a Trigger
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bloomberg-data-license-triggers.createtrigger
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-trigger-details
      description: Get Trigger Details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bloomberg-data-license-triggers.gettrigger
      outputParameters:
      - type: object
        mapping: $.
