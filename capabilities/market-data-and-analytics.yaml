naftiko: 1.0.0-alpha2
info:
  label: Bloomberg Market Data and Analytics
  description: Workflow for accessing Bloomberg market data combining the Data License HAPI for bulk data with the HTTP API
    for real-time reference and historical data, used by quantitative analysts and portfolio managers.
  tags:
  - Bloomberg
  - Market Data
  - Financial Analytics
  - Reference Data
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    BLOOMBERG_HAPI_TOKEN: BLOOMBERG_HAPI_TOKEN
    BLOOMBERG_HTTP_USERNAME: BLOOMBERG_HTTP_USERNAME
    BLOOMBERG_HTTP_PASSWORD: BLOOMBERG_HTTP_PASSWORD
capability:
  consumes:
  - type: http
    namespace: data-license
    baseUri: https://api.bloomberg.com/eap
    description: Bloomberg Data License HAPI for financial data
    authentication:
      type: bearer
      token: '{{BLOOMBERG_HAPI_TOKEN}}'
    resources:
    - name: catalogs
      path: /catalogs
      description: Data catalog browsing
      operations:
      - name: list-catalogs
        method: GET
        description: List available data catalogs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-catalog
        method: GET
        description: Get catalog details
        inputParameters:
        - name: catalogId
          in: path
          type: string
          required: true
          description: Catalog identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: universes
      path: /universes
      description: Security universe management
      operations:
      - name: list-universes
        method: GET
        description: List security universes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-universe
        method: POST
        description: Create a security universe
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            identifier: '{{tools.identifier}}'
            title: '{{tools.title}}'
      - name: get-universe
        method: GET
        description: Get universe details
        inputParameters:
        - name: universeId
          in: path
          type: string
          required: true
          description: Universe identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-universe
        method: DELETE
        description: Delete a universe
        inputParameters:
        - name: universeId
          in: path
          type: string
          required: true
          description: Universe identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: field-lists
      path: /fieldLists
      description: Field list management
      operations:
      - name: list-field-lists
        method: GET
        description: List field lists
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-field-list
        method: POST
        description: Create a field list
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-field-list
        method: GET
        description: Get field list details
        inputParameters:
        - name: fieldListId
          in: path
          type: string
          required: true
          description: Field list identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: requests
      path: /requests
      description: Data request management
      operations:
      - name: list-requests
        method: GET
        description: List data requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-request
        method: POST
        description: Create a data request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: distributions
      path: /distributions
      description: Data distribution access
      operations:
      - name: list-distributions
        method: GET
        description: List data distributions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-distribution
        method: GET
        description: Get distribution details and download URL
        inputParameters:
        - name: distributionId
          in: path
          type: string
          required: true
          description: Distribution identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: http-api
    baseUri: https://localhost:3000
    description: Bloomberg HTTP API for reference and historical data
    authentication:
      type: basic
      username: '{{BLOOMBERG_HTTP_USERNAME}}'
      password: '{{BLOOMBERG_HTTP_PASSWORD}}'
    resources:
    - name: request
      path: /request
      description: Generic BLPAPI request endpoint
      operations:
      - name: send-request
        method: POST
        description: Send a BLPAPI request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            service: '{{tools.service}}'
            operation: '{{tools.operation}}'
            parameters: '{{tools.parameters}}'
    - name: reference-data
      path: /request
      description: Reference data requests
      operations:
      - name: get-reference-data
        method: POST
        description: Get reference data for securities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            service: //blp/refdata
            operation: ReferenceDataRequest
            parameters:
              securities: '{{tools.securities}}'
              fields: '{{tools.fields}}'
    - name: historical-data
      path: /request
      description: Historical data requests
      operations:
      - name: get-historical-data
        method: POST
        description: Get historical end-of-day data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            service: //blp/refdata
            operation: HistoricalDataRequest
            parameters:
              securities: '{{tools.securities}}'
              fields: '{{tools.fields}}'
              startDate: '{{tools.startDate}}'
              endDate: '{{tools.endDate}}'
    - name: intraday-data
      path: /request
      description: Intraday data requests
      operations:
      - name: get-intraday-bars
        method: POST
        description: Get intraday bar data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-intraday-ticks
        method: POST
        description: Get intraday tick data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: field-search
      path: /request
      description: Field discovery
      operations:
      - name: search-fields
        method: POST
        description: Search available data fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-field-info
        method: POST
        description: Get field metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instruments
      path: /request
      description: Instrument search
      operations:
      - name: search-instruments
        method: POST
        description: Search for securities and instruments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: market-data-api
    description: Unified REST API for Bloomberg market data and analytics.
    resources:
    - path: /v1/catalogs
      name: catalogs
      description: Data catalog browsing
      operations:
      - method: GET
        name: list-catalogs
        description: List available data catalogs
        call: data-license.list-catalogs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/universes
      name: universes
      description: Security universe management
      operations:
      - method: GET
        name: list-universes
        description: List security universes
        call: data-license.list-universes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/field-lists
      name: field-lists
      description: Field list management
      operations:
      - method: GET
        name: list-field-lists
        description: List field lists
        call: data-license.list-field-lists
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/reference-data
      name: reference-data
      description: Reference data access
      operations:
      - method: POST
        name: get-reference-data
        description: Get reference data for securities
        call: http-api.get-reference-data
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/historical-data
      name: historical-data
      description: Historical data access
      operations:
      - method: POST
        name: get-historical-data
        description: Get historical end-of-day data
        call: http-api.get-historical-data
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/distributions
      name: distributions
      description: Data distributions
      operations:
      - method: GET
        name: list-distributions
        description: List completed data distributions
        call: data-license.list-distributions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: market-data-mcp
    transport: http
    description: MCP server for AI-assisted Bloomberg market data access.
    tools:
    - name: list-catalogs
      description: List available Bloomberg data catalogs
      hints:
        readOnly: true
      call: data-license.list-catalogs
      outputParameters:
      - type: object
        mapping: $.
    - name: get-catalog
      description: Get data catalog details
      hints:
        readOnly: true
      call: data-license.get-catalog
      with:
        catalogId: tools.catalogId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-universes
      description: List security universes
      hints:
        readOnly: true
      call: data-license.list-universes
      outputParameters:
      - type: object
        mapping: $.
    - name: create-universe
      description: Create a security universe for data requests
      hints:
        readOnly: false
      call: data-license.create-universe
      outputParameters:
      - type: object
        mapping: $.
    - name: list-field-lists
      description: List field lists for data requests
      hints:
        readOnly: true
      call: data-license.list-field-lists
      outputParameters:
      - type: object
        mapping: $.
    - name: create-data-request
      description: Create a Bloomberg data request
      hints:
        readOnly: false
      call: data-license.create-request
      outputParameters:
      - type: object
        mapping: $.
    - name: list-distributions
      description: List completed data distributions
      hints:
        readOnly: true
      call: data-license.list-distributions
      outputParameters:
      - type: object
        mapping: $.
    - name: get-reference-data
      description: Get reference data for securities via HTTP API
      hints:
        readOnly: true
      call: http-api.get-reference-data
      outputParameters:
      - type: object
        mapping: $.
    - name: get-historical-data
      description: Get historical data for securities
      hints:
        readOnly: true
      call: http-api.get-historical-data
      outputParameters:
      - type: object
        mapping: $.
    - name: get-intraday-bars
      description: Get intraday bar data
      hints:
        readOnly: true
      call: http-api.get-intraday-bars
      outputParameters:
      - type: object
        mapping: $.
    - name: search-fields
      description: Search available Bloomberg data fields
      hints:
        readOnly: true
      call: http-api.search-fields
      outputParameters:
      - type: object
        mapping: $.
    - name: search-instruments
      description: Search for securities and instruments
      hints:
        readOnly: true
      call: http-api.search-instruments
      outputParameters:
      - type: object
        mapping: $.
