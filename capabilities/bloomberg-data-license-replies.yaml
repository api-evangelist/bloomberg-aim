naftiko: 1.0.0-alpha2
info:
  label: Bloomberg Data License API (HAPI) — Replies
  description: 'Bloomberg Data License API (HAPI) — Replies. 2 operations. Lead operation: List Replies for a Distribution.
    Self-contained Naftiko capability covering one Bloomberg Aim business surface.'
  tags:
  - Bloomberg Aim
  - Replies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BLOOMBERG_AIM_API_KEY: BLOOMBERG_AIM_API_KEY
capability:
  consumes:
  - type: http
    namespace: bloomberg-data-license-replies
    baseUri: https://api.bloomberg.com/eap
    description: Bloomberg Data License API (HAPI) — Replies business capability. Self-contained, no shared references.
    resources:
    - name: catalogs-catalogId-distributions-distributionId-replies
      path: /catalogs/{catalogId}/distributions/{distributionId}/replies
      operations:
      - name: listreplies
        method: GET
        description: List Replies for a Distribution
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: catalogs-catalogId-distributions-distributionId-replies-replyId
      path: /catalogs/{catalogId}/distributions/{distributionId}/replies/{replyId}
      operations:
      - name: getreply
        method: GET
        description: Download a Reply
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.BLOOMBERG_AIM_API_KEY}}'
  exposes:
  - type: rest
    namespace: bloomberg-data-license-replies-rest
    port: 8080
    description: REST adapter for Bloomberg Data License API (HAPI) — Replies. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/catalogs/{catalogid}/distributions/{distributionid}/replies
      name: catalogs-catalogid-distributions-distributionid-replies
      description: REST surface for catalogs-catalogId-distributions-distributionId-replies.
      operations:
      - method: GET
        name: listreplies
        description: List Replies for a Distribution
        call: bloomberg-data-license-replies.listreplies
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/catalogs/{catalogid}/distributions/{distributionid}/replies/{replyid}
      name: catalogs-catalogid-distributions-distributionid-replies-replyid
      description: REST surface for catalogs-catalogId-distributions-distributionId-replies-replyId.
      operations:
      - method: GET
        name: getreply
        description: Download a Reply
        call: bloomberg-data-license-replies.getreply
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bloomberg-data-license-replies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bloomberg Data License API (HAPI) — Replies. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-replies-distribution
      description: List Replies for a Distribution
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bloomberg-data-license-replies.listreplies
      outputParameters:
      - type: object
        mapping: $.
    - name: download-reply
      description: Download a Reply
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bloomberg-data-license-replies.getreply
      outputParameters:
      - type: object
        mapping: $.
