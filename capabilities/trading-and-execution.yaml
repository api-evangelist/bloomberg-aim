naftiko: 1.0.0-alpha2
info:
  label: Bloomberg Trading and Execution
  description: Workflow for automated trading combining EMSX order/route management with HTTP API market data for traders
    and algorithmic trading teams.
  tags:
  - Bloomberg
  - Trading
  - Execution Management
  - Order Management
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    BLOOMBERG_EMSX_TOKEN: BLOOMBERG_EMSX_TOKEN
    BLOOMBERG_HTTP_USERNAME: BLOOMBERG_HTTP_USERNAME
    BLOOMBERG_HTTP_PASSWORD: BLOOMBERG_HTTP_PASSWORD
capability:
  consumes:
  - type: http
    namespace: emsx
    baseUri: https://localhost:3000
    description: Bloomberg EMSX API via BLPAPI HTTP bridge
    authentication:
      type: bearer
      token: '{{BLOOMBERG_EMSX_TOKEN}}'
    resources:
    - name: orders
      path: /request/blp/emapisvc
      description: Order management
      operations:
      - name: create-order
        method: POST
        description: Create a new order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            EMSX_TICKER: '{{tools.ticker}}'
            EMSX_AMOUNT: '{{tools.amount}}'
            EMSX_ORDER_TYPE: '{{tools.orderType}}'
            EMSX_SIDE: '{{tools.side}}'
            EMSX_TIF: '{{tools.tif}}'
      - name: modify-order
        method: POST
        description: Modify an existing order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-order
        method: POST
        description: Delete/cancel an order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-orders
        method: POST
        description: Get orders from the blotter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: routes
      path: /request/blp/emapisvc
      description: Route management
      operations:
      - name: route-order
        method: POST
        description: Route an order to a broker
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: modify-route
        method: POST
        description: Modify a route
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-routes
        method: POST
        description: Get routes from the blotter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: fills
      path: /request/blp/emapisvc
      description: Fill tracking
      operations:
      - name: get-fills
        method: POST
        description: Get order fills
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: broker-strategies
      path: /request/blp/emapisvc
      description: Broker strategy queries
      operations:
      - name: get-broker-strategies
        method: POST
        description: Get available broker strategies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-broker-strategy-info
        method: POST
        description: Get broker strategy details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: teams
      path: /request/blp/emapisvc
      description: Team management
      operations:
      - name: get-teams
        method: POST
        description: Get EMSX teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: http-api
    baseUri: https://localhost:3000
    description: Bloomberg HTTP API for reference and historical data
    authentication:
      type: basic
      username: '{{BLOOMBERG_HTTP_USERNAME}}'
      password: '{{BLOOMBERG_HTTP_PASSWORD}}'
    resources:
    - name: request
      path: /request
      description: Generic BLPAPI request endpoint
      operations:
      - name: send-request
        method: POST
        description: Send a BLPAPI request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            service: '{{tools.service}}'
            operation: '{{tools.operation}}'
            parameters: '{{tools.parameters}}'
    - name: reference-data
      path: /request
      description: Reference data requests
      operations:
      - name: get-reference-data
        method: POST
        description: Get reference data for securities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            service: //blp/refdata
            operation: ReferenceDataRequest
            parameters:
              securities: '{{tools.securities}}'
              fields: '{{tools.fields}}'
    - name: historical-data
      path: /request
      description: Historical data requests
      operations:
      - name: get-historical-data
        method: POST
        description: Get historical end-of-day data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            service: //blp/refdata
            operation: HistoricalDataRequest
            parameters:
              securities: '{{tools.securities}}'
              fields: '{{tools.fields}}'
              startDate: '{{tools.startDate}}'
              endDate: '{{tools.endDate}}'
    - name: intraday-data
      path: /request
      description: Intraday data requests
      operations:
      - name: get-intraday-bars
        method: POST
        description: Get intraday bar data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-intraday-ticks
        method: POST
        description: Get intraday tick data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: field-search
      path: /request
      description: Field discovery
      operations:
      - name: search-fields
        method: POST
        description: Search available data fields
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-field-info
        method: POST
        description: Get field metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: instruments
      path: /request
      description: Instrument search
      operations:
      - name: search-instruments
        method: POST
        description: Search for securities and instruments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8081
    namespace: trading-api
    description: Unified REST API for Bloomberg trading and execution.
    resources:
    - path: /v1/orders
      name: orders
      description: Order management
      operations:
      - method: POST
        name: create-order
        description: Create a trading order
        call: emsx.create-order
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: get-orders
        description: Get orders from blotter
        call: emsx.get-orders
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/routes
      name: routes
      description: Route management
      operations:
      - method: POST
        name: route-order
        description: Route an order to a broker
        call: emsx.route-order
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: get-routes
        description: Get routes from blotter
        call: emsx.get-routes
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/fills
      name: fills
      description: Fill tracking
      operations:
      - method: POST
        name: get-fills
        description: Get order fills
        call: emsx.get-fills
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/market-data
      name: market-data
      description: Market data for trading decisions
      operations:
      - method: POST
        name: get-reference-data
        description: Get security reference data
        call: http-api.get-reference-data
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9091
    namespace: trading-mcp
    transport: http
    description: MCP server for AI-assisted Bloomberg trading and execution.
    tools:
    - name: create-order
      description: Create a new trading order
      hints:
        readOnly: false
      call: emsx.create-order
      outputParameters:
      - type: object
        mapping: $.
    - name: modify-order
      description: Modify an existing order
      hints:
        readOnly: false
      call: emsx.modify-order
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-order
      description: Cancel/delete an order
      hints:
        readOnly: false
        destructive: true
      call: emsx.delete-order
      outputParameters:
      - type: object
        mapping: $.
    - name: get-orders
      description: Get orders from the EMSX blotter
      hints:
        readOnly: true
      call: emsx.get-orders
      outputParameters:
      - type: object
        mapping: $.
    - name: route-order
      description: Route an order to a broker
      hints:
        readOnly: false
      call: emsx.route-order
      outputParameters:
      - type: object
        mapping: $.
    - name: get-routes
      description: Get routes from the EMSX blotter
      hints:
        readOnly: true
      call: emsx.get-routes
      outputParameters:
      - type: object
        mapping: $.
    - name: get-fills
      description: Get order and route fills
      hints:
        readOnly: true
      call: emsx.get-fills
      outputParameters:
      - type: object
        mapping: $.
    - name: get-broker-strategies
      description: Get available broker strategies
      hints:
        readOnly: true
      call: emsx.get-broker-strategies
      outputParameters:
      - type: object
        mapping: $.
    - name: get-teams
      description: Get EMSX teams
      hints:
        readOnly: true
      call: emsx.get-teams
      outputParameters:
      - type: object
        mapping: $.
    - name: get-reference-data
      description: Get security reference data for trading
      hints:
        readOnly: true
      call: http-api.get-reference-data
      outputParameters:
      - type: object
        mapping: $.
    - name: get-intraday-ticks
      description: Get intraday tick data for a security
      hints:
        readOnly: true
      call: http-api.get-intraday-ticks
      outputParameters:
      - type: object
        mapping: $.
