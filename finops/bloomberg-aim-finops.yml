specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Bloomberg AIM
providerId: bloomberg-aim
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Order Management
  - Portfolio Management
  - Trading
description: 'FOCUS-aligned FinOps placeholder for Bloomberg AIM: enterprise buy-side OMS / IBOR
  platform billed under a contract-negotiated annual subscription typically combined with named-user
  seats and Bloomberg market-data feeds.'
sources:
  - https://www.bloomberg.com/professional/products/bloomberg-terminal/
notes: AIM commercial terms are bundled into the Bloomberg Enterprise contract; reconcile against
  the active subscription for actual fee structure.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Bloomberg L.P.
serviceCategory: Buy-side OMS / IBOR
billingModel:
  pricingCategory: Enterprise Subscription (Negotiated)
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Bloomberg AIM
  ServiceCategory: Buy-side OMS / IBOR
  ProviderName: Bloomberg
  PublisherName: Bloomberg L.P.
  InvoiceIssuerName: Bloomberg L.P.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: aim_subscription
    unit: year
    aggregation: sum
    dimensions:
      - module
      - tenant
  - name: aim_named_users
    unit: seat
    aggregation: max
    dimensions:
      - tenant
      - role
  - name: aim_orders
    unit: order
    aggregation: sum
    dimensions:
      - asset_class
      - venue
  - name: market_data_passthrough
    unit: record
    aggregation: sum
    dimensions:
      - feed
      - exchange
principles:
  - name: Visibility
    description: Use AIM administration and Bloomberg client-services usage reports to track
      module activation, named-user counts, and order throughput.
  - name: Allocation
    description: Map AIM tenants and modules to the consuming desk / strategy for chargeback;
      reconcile against the bundled Bloomberg Enterprise invoice.
  - name: Optimization
    description: Reclaim unused AIM seats during annual renewal; align AIM module mix with
      portfolio strategy; consolidate market-data passthrough into shared B-PIPE rather than
      per-AIM-tenant feeds where possible.
  - name: Accountability
    description: Designate an AIM contract owner per legal entity; review utilization quarterly
      with Bloomberg Enterprise client services.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
