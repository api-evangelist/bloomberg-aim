description: Bloomberg AIM (Asset and Investment Manager) is an enterprise buy-side order management,
  IBOR, and compliance platform sold through Bloomberg Enterprise. Pricing is contract-negotiated and
  not published publicly; AIM is typically licensed alongside Bloomberg Terminal seats and B-PIPE /
  Data License feeds. This artifact captures the offering shape rather than published rates.
sources:
  - https://www.bloomberg.com/professional/products/bloomberg-terminal/
notes: AIM commercial terms are private and bundled into the Bloomberg Enterprise contract;
  reconcile with the active AIM contract.
plans:
  - id: bloomberg-aim-enterprise
    name: AIM Enterprise (Contact Sales)
    type: enterprise
    description: Custom-negotiated enterprise license for AIM. Typical bundles include named-user
      seats, IBOR / OMS modules, compliance, and connectivity to Bloomberg market data.
    entries:
      - label: AIM platform subscription
        name: aim_subscription
        type: subscription
