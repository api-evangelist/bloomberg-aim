aid: bloomberg-aim
name: Bloomberg AIM
description: >-
  Bloomberg's Asset and Investment Manager (AIM) is a comprehensive buy-side solution offering global, multi-asset
  capabilities for portfolio management, trading, compliance, and operations. Bloomberg provides a suite of developer
  APIs including BLPAPI, Server API, and the Hypermedia API for programmatic access to market data, analytics, and
  enterprise services.
type: Index
accessModel:
  pricing: enterprise
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Enterprise · Self-serve signup
  confidence: high
