specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Bloomberg AIM
providerId: bloomberg-aim
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Order Management
  - Portfolio Management
  - Trading
  - Rate Limiting
description: Bloomberg AIM does not publish public API rate limits. Throughput, concurrency, and
  message-rate ceilings are governed by the customer's AIM contract, the upstream BLPAPI / B-PIPE
  agreements, and the FIX broker network.
sources:
  - https://www.bloomberg.com/professional/products/bloomberg-terminal/
notes: AIM throttling values are private and tenant-specific. Reconcile against the active AIM
  contract and FIX session configuration.
responseCodes:
  throttled: see AIM client diagnostics
  quotaExceeded: see AIM client diagnostics
limits:
  - name: AIM API / FIX session
    scope: tenant
    metric: varies
    limit: see AIM contract / FIX session configuration
    notes: Per-tenant order throughput, message rate, and concurrent session ceilings are
      configured at AIM tenant provisioning time.
  - name: BLPAPI bridge
    scope: account/terminal
    metric: varies
    limit: see Bloomberg BLPAPI documentation
    notes: AIM workflows that read or write through BLPAPI inherit BLPAPI's daily field/security
      caps documented inside the Terminal.
policies:
  - name: Tenant-scoped throttling
    description: Limits apply per AIM tenant; raises require Bloomberg Enterprise client services
      engagement.
  - name: Backoff
    description: Clients should respect AIM SDK / FIX session events and apply exponential backoff
      with jitter on throttled responses.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
